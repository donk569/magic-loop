<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170a2e">
  <meta name="description" content="一段停不下来的循环音频。">
  <title>魔音循环</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="halo" aria-hidden="true"></div>

    <header class="head">
      <h1 class="title">魔音循环</h1>
      <p class="tagline">你已经被这段声音锁定，停不下来。</p>
    </header>

    <!-- 纯视觉波形：只在音频真正播放时动 -->
    <div class="wave" id="wave" aria-hidden="true"></div>

    <p class="status" id="status" role="status" aria-live="polite" data-tone="idle">正在准备…</p>
    <p class="hint" id="hint">如果一直没有声音，通常是浏览器拦截了自动播放。</p>

    <footer class="foot">刷新页面会重新尝试一次自动播放</footer>
  </main>

  <audio id="audio" src="assets/prank.mp3" loop preload="auto" playsinline></audio>
  <script src="script.js"></script>
</body>
</html>
